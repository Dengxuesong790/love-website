<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台登录 - 爱情纪念网站</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-wrap">
        <div class="login-card">
            <div class="login-icon">💕</div>
            <div class="login-title">爱情纪念网站管理后台</div>
            <div class="login-subtitle">登录后管理站点配置、情书、相册与音乐</div>

            <div class="form-group">
                <label for="username">账号</label>
                <input type="text" id="username" class="form-control" placeholder="请输入管理员账号" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" class="form-control" placeholder="请输入密码" autocomplete="current-password">
            </div>

            <button class="btn-primary" id="loginBtn">登 录</button>
            <div class="msg" id="msg"></div>
        </div>
    </div>

    <script src="../js/api-config.js"></script>
    <script>
        const API = window.API_BASE;

        // 已登录则直接进入管理页
        if (localStorage.getItem('admin_token')) {
            window.location.href = 'index.html';
        }

        // 登录过期提示（从管理页 401 跳转回来时显示）
        if (new URLSearchParams(location.search).get('expired')) {
            const msg = document.getElementById('msg');
            msg.className = 'msg error';
            msg.textContent = '登录已过期，请重新登录';
        }

        async function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const msg = document.getElementById('msg');
            const btn = document.getElementById('loginBtn');

            if (!username || !password) {
                msg.className = 'msg error';
                msg.textContent = '请输入账号和密码';
                return;
            }

            btn.disabled = true;
            btn.textContent = '登录中...';
            msg.textContent = '';

            try {
                const res = await fetch(API + '/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const result = await res.json();

                if (result.code === 200) {
                    localStorage.setItem('admin_token', result.data.token);
                    localStorage.setItem('admin_username', result.data.username);
                    msg.className = 'msg success';
                    msg.textContent = '登录成功，正在进入...';
                    setTimeout(() => window.location.href = 'index.html', 500);
                } else {
                    msg.className = 'msg error';
                    msg.textContent = result.message || '登录失败';
                    btn.disabled = false;
                    btn.textContent = '登 录';
                }
            } catch (e) {
                msg.className = 'msg error';
                msg.textContent = '无法连接后端服务，请检查后端是否已启动';
                btn.disabled = false;
                btn.textContent = '登 录';
            }
        }

        document.getElementById('loginBtn').addEventListener('click', login);
        document.getElementById('password').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
